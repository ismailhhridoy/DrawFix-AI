name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: plancheck-ai

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # needed for Workload Identity Federation (alternative to SA key)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Alternative (recommended): use Workload Identity Federation instead of a SA key:
          # workload_identity_provider: 'projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER'
          # service_account: 'SERVICE_ACCOUNT@PROJECT.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build & push container image
        run: |
          docker build \
            --build-arg GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -t gcr.io/$PROJECT_ID/$SERVICE:$GITHUB_SHA \
            -t gcr.io/$PROJECT_ID/$SERVICE:latest \
            .
          docker push gcr.io/$PROJECT_ID/$SERVICE:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$SERVICE:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            APP_URL=${{ secrets.APP_URL }}
            NODE_ENV=production

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
